name: Build for Beat Saber

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Beat Saber
        uses: nicoco007/setup-beat-saber@v1
        with:
          project-path: ${{ github.workspace }}/src/Reactive.BeatSaber/Reactive.BeatSaber.csproj
          path: ${{ runner.temp }}/BeatSaberReferenceAssemblies

      - name: Build
        id: build
        run: dotnet build -c "Beat Saber Release" "${{ github.workspace }}/Reactive.sln"

      - name: Upload library
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.filename }}
          path: ${{ steps.build.outputs.artifactpath }}
          if-no-files-found: error

      - name: Upload compiler NuGet
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/src/Reactive.Compiler/bin/Release/*.nupkg
          archive: false
          if-no-files-found: error
