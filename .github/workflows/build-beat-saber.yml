name: Build for Beat Saber

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Beat Saber
        uses: nicoco007/setup-beat-saber@v1
        with:
          project-path: ${{ github.workspace }}/src/Reactive.BeatSaber/Reactive.BeatSaber.csproj
          path: ${{ runner.temp }}/BeatSaberReferenceAssemblies

      - name: Build
        id: build
        run: dotnet build -c Release "${{ github.workspace }}/src/Reactive.BeatSaber/Reactive.BeatSaber.csproj"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.build.outputs.filename }}
          path: ${{ steps.build.outputs.artifactpath }}
